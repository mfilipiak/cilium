---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stc-far-proxy
  labels:
    app: stc-far-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stc-far-proxy
  template:
    metadata:
      labels:
        app: stc-far-proxy
      annotations:
        io.cilium.io/ip-pool: ip-10.1.2.100
    spec:
      nodeName: kind-worker2
      terminationGracePeriodSeconds: 3
      containers:
      - name: netshoot
        image: nicolaka/netshoot:v0.13
        command: ["python3"]
        args: ["-m", "http.server", "80"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
          privileged: true

