apiVersion: apps/v1
kind: Deployment
metadata:
  name: netshoot
  labels:
    app: netshoot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netshoot
  template:
    metadata:
      labels:
        app: netshoot
    spec:
      nodeName: kind-worker
      terminationGracePeriodSeconds: 3
      containers:
      - name: netshoot
        image: nicolaka/netshoot:v0.13
        command: ["sleep"]
        args: ["infinity"]
