---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stc-far-proxy
  labels:
    app: stc-far-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stc-far-proxy
  template:
    metadata:
      labels:
        app: stc-far-proxy
      annotations:
        io.cilium.io/ip-pool: ip-10.1.2.100
    spec:
      nodeName: kind-worker2
      terminationGracePeriodSeconds: 3
      containers:
      - name: netshoot
        image: nicolaka/netshoot:v0.13
        command: ["python3"]
        args: ["-m", "http.server", "80"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
          privileged: true
---
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: egress-proxy
spec:
  # Specify which pods should be subject to the current policy.
  # Multiple pod selectors can be specified.
  selectors:
  - podSelector:
      matchLabels:
        app: netshoot
  # Specify which destination CIDR(s) this policy applies to.
  # Multiple CIDRs can be specified.
  destinationCIDRs:
  - "0.0.0.0/0"

  # Configure the gateway node.
  egressGateway:
    podSelector:
      matchLabels:
        app: stc-far-proxy
    # # Specify which node should act as gateway for this policy.
    # nodeSelector:
